name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security issues here** — see [SECURITY.md](../SECURITY.md).
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: This is not a security issue, and I removed private data and local paths.
          required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Run ...
        3. See the error
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: DSH, dsh-better-sidebar, OS, Node.js and Python/Jupyter versions.
      placeholder: "DSH 0.2.2-rc.1, better-sidebar 0.30.1, macOS, Node 24, Python 3.14"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Notebook, logs or screenshots (optional)
      description: A minimal sanitized notebook and relevant output help a lot. Remove secrets and private content.
