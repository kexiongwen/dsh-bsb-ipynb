name: Bug report
description: Report a reproducible problem with dsh-bsb-ipynb
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve dsh-bsb-ipynb.

        **Do not report security vulnerabilities here** — see [SECURITY.md](../SECURITY.md) instead.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
        - label: I removed secrets, private notebook content and local paths from this report.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Click ...
        3. See the error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      placeholder: "0.2.2-rc.1"
    validations:
      required: true
  - type: input
    id: sidebar-version
    attributes:
      label: dsh-better-sidebar version
      placeholder: "0.30.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: "v24.13.1"
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python and Jupyter package versions
      description: Python version plus jupyter_client / ipykernel versions, if relevant.
      placeholder: "Python 3.14.7, jupyter_client 8.10.0, ipykernel 7.3.0"
  - type: textarea
    id: notebook
    attributes:
      label: Minimal reproduction notebook
      description: |
        Paste a minimal sanitized `.ipynb`, or the smallest cell and code that reproduces the problem.
        Do not attach private notebook content.
      render: json
  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots or error output
      description: Relevant console or server output. Remove credentials and local paths first.
      render: shell
