name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 22

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install kernel dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install jupyter_client ipykernel nbformat
          echo "DSH_IPYNB_TEST_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"

      - name: Static checks
        run: |
          node --check index.js lib/*.js client.js
          python -m py_compile python/bridge.py

      # Real-kernel tests run because the Python dependencies are installed.
      # The ~28 case-insensitivity tests skip on Ubuntu (case-sensitive ext4)
      # and run on macOS.
      - name: Run tests
        run: npm test

      - name: Check package contents
        run: npm pack --dry-run
